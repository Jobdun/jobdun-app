<!DOCTYPE html><html lang="en-AU"><head>
  <!--
    Jobdun web app — app.jobdun.com.au
    Built with Flutter Web from lib/main.dart (the SAME consumer app that
    ships on iOS and Android; there is no separate web entrypoint since
    main_web.dart was folded back into main.dart).

    NOT the marketing site. jobdun.com.au is a separate Next.js repo
    (KpG782/jobdun-web) — this shell used to carry that site's copy, which
    meant every link preview of the app pointed at the marketing homepage
    (platform audit, 2026-08-19).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F8F8F8" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">

  <title>Jobdun</title>
  <meta name="description" content="Sign in to Jobdun — post jobs, review applicants, and manage your trade work from any browser.">
  <meta name="author" content="Jobdun Pty Ltd">

  <!-- The app is a signed-in product surface, not a landing page. Keep it out
       of search results so jobdun.com.au stays the indexed entry point and
       users never land on a bare login screen from Google. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph — points at the APP, not the marketing site. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jobdun">
  <meta property="og:title" content="Jobdun">
  <meta property="og:description" content="Post jobs, review applicants, and manage your trade work from any browser.">
  <meta property="og:url" content="https://app.jobdun.com.au">
  <meta property="og:image" content="https://jobdun.com.au/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_AU">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jobdun">
  <meta name="twitter:description" content="Post jobs, review applicants, and manage your trade work from any browser.">
  <meta name="twitter:image" content="https://jobdun.com.au/og-image.png">

  <!-- iOS / mobile web -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jobdun">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon — Jobdun badge. SVG for modern browsers, PNG fallback. -->
  <link rel="icon" type="image/svg+xml" href="jobdun-badge.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="manifest" href="manifest.json">

  <!-- Brand splash — pre-Flutter paint. Matches the app's dark slate
       background so there's no white flash while main.dart.js downloads.
       The hammer-J badge mark stays centred until Flutter takes over. -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #F8F8F8;
      color: #111118;
      font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #FC5101;
      transition: opacity 300ms ease;
    }

    .splash img {
      width: 96px;
      height: 96px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1.0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash img { animation: none; opacity: 1.0; }
    }
  </style>
  <script>
    // Remove the splash once Flutter has actually mounted its view.
    //
    // This used to wait on window.removeSplash() being called from
    // lib/website/app/website_app.dart — a file the app entrypoint never
    // loads, so nothing ever called it and the splash node lived on until
    // the 8s failsafe (verified in-browser, 2026-08-19). It sat *behind*
    // <flutter-view> so users never saw it, but "invisible only because of
    // DOM ordering" is not a load screen we want to rely on.
    //
    // Observing the DOM for <flutter-view> needs no Dart-side hook and works
    // with any renderer.
    (function () {
      var removed = false;
      function removeSplash() {
        if (removed) return;
        removed = true;
        var el = document.getElementById('splash');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(function () { if (el.parentNode) el.remove(); }, 320);
      }
      window.removeSplash = removeSplash;

      function flutterMounted() {
        return !!document.querySelector('flutter-view, flt-glass-pane');
      }

      if (flutterMounted()) {
        removeSplash();
      } else {
        var observer = new MutationObserver(function () {
          if (flutterMounted()) {
            observer.disconnect();
            removeSplash();
          }
        });
        observer.observe(document.body || document.documentElement, {
          childList: true,
          subtree: true,
        });
        // Failsafe: if Flutter never bootstraps (network error, unsupported
        // browser), don't leave a pulsing mark on screen forever.
        setTimeout(function () {
          observer.disconnect();
          removeSplash();
        }, 8000);
      }
    })();
  </script>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FC5101;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  

  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
