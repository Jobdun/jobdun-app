name: Admin user management

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-users/**'
      - 'supabase/functions/_shared/cors.ts'
      - 'supabase/migrations/*admin_user_management.sql'
      - 'supabase/migrations/*admin_safety.sql'
      - 'supabase/rollbacks/*admin_safety_down.sql'
      - 'supabase/tests/admin_safety*'
      - 'supabase/tests/run_admin_safety.sh'
      - 'supabase/migrations/*company_admin.sql'
      - 'supabase/rollbacks/*company_admin_down.sql'
      - 'supabase/tests/company_admin*'
      - 'supabase/tests/run_company_admin.sh'
      - 'supabase/schema.sql'
      - '.github/workflows/admin-user-management.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/admin-users/**'
      - 'supabase/functions/_shared/cors.ts'
      - 'supabase/migrations/*admin_user_management.sql'
      - 'supabase/migrations/*admin_safety.sql'
      - 'supabase/rollbacks/*admin_safety_down.sql'
      - 'supabase/tests/admin_safety*'
      - 'supabase/tests/run_admin_safety.sh'
      - 'supabase/migrations/*company_admin.sql'
      - 'supabase/rollbacks/*company_admin_down.sql'
      - 'supabase/tests/company_admin*'
      - 'supabase/tests/run_company_admin.sh'
      - 'supabase/schema.sql'
      - '.github/workflows/admin-user-management.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/admin-users/index.ts
      - run: deno lint supabase/functions/admin-users/
      - run: deno fmt --check supabase/functions/admin-users/*.ts
      - name: Handler, SDK and isolated PostgreSQL tests
        run: deno test --allow-read supabase/functions/admin-users/

  safety:
    name: Admin SQL safety and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Isolated permissions, rollback and concurrency regressions
        # Official mirror with the same image digest; anonymous ECR pulls are
        # rate-limited on shared GitHub-hosted runner addresses.
        env:
          ADMIN_TEST_IMAGE: ghcr.io/supabase/postgres:17.6.1.111@sha256:dda62da900896d4a8f1cf687cd9912c8d3ea4ad442c9273c27848fa8f42da6cc
        run: bash supabase/tests/run_admin_safety.sh

  company:
    name: Company SQL scopes, mutations and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Isolated company authorization and rollback regressions
        env:
          ADMIN_TEST_IMAGE: ghcr.io/supabase/postgres:17.6.1.111@sha256:dda62da900896d4a8f1cf687cd9912c8d3ea4ad442c9273c27848fa8f42da6cc
        run: bash supabase/tests/run_company_admin.sh
